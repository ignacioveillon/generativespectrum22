<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Harmonic Bars – Structured</title>

<style>
/* =========================================================
   BASE / LAYOUT
========================================================= */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* =========================================================
   BARS UI
========================================================= */
#bars {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.row {
  display: flex;
  align-items: center;
}

.track {
  position: relative;
  width: calc(100% - 16px);
  height: 100%;
  margin: 0 8px;
}

.bar {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: #fff;
}

/* =========================================================
   INFO GRID UI
========================================================= */
#infoGrid {
  position: fixed;
  bottom: 8px;
  right: 8px;
  display: grid;
  grid-template-columns: repeat(6, auto);
  grid-template-rows: repeat(9, auto);
  gap: 4px 12px;
  font-size: 11px;
  background: rgba(0,0,0,0.6);
  padding: 6px 8px;
  border: 1px solid #444;
}

.label, .value {
  border: 2px solid #fff;
  padding: 4px 6px;
  box-sizing: border-box;
}

.label { opacity: 0.8; }
.value { font-weight: bold; }
</style>
</head>

<body>

<button id="start">Start Audio</button>

<!-- =========================================================
     UI: INFO GRID
========================================================= -->
<div id="infoGrid">

<!-- ENCABEZADO -->
 <div class="label"> </div>

<div class="label"></div> <!-- NUEVA columna 6 -->

<!-- FILA G1 -->
<div class="value">G1</div>

<div class="value" id="g1Active">0</div>
